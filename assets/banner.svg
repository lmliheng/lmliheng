<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="liheng — Agent 自我进化 · Vue 生态 · LLM 微调">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#101a28"/>
      <stop offset="1" stop-color="#0d1b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="0.45" stop-color="#39d353"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#1f6feb" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#8b949e" opacity="0.16"/>
    </pattern>
    <clipPath id="round">
      <rect width="1000" height="240" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="240" fill="url(#bg)"/>
    <rect width="1000" height="240" fill="url(#glow)"/>
    <rect x="620" width="380" height="240" fill="url(#dots)"/>
    <rect y="236" width="1000" height="4" fill="url(#accent)"/>
  </g>

  <rect x="64" y="58" width="4" height="118" rx="2" fill="url(#accent)"/>

  <text x="90" y="112" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="62" font-weight="700" fill="#e6edf3" letter-spacing="-1">liheng</text>

  <text x="92" y="146" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="19" fill="#7d8590">@lmliheng · 中南大学 · 长沙</text>

  <text x="92" y="182" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="18" font-weight="600" fill="#58a6ff">Agent 自我进化</text>
  <text x="236" y="182" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="18" fill="#484f58">·</text>
  <text x="252" y="182" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="18" font-weight="600" fill="#39d353">Vue 生态</text>
  <text x="344" y="182" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="18" fill="#484f58">·</text>
  <text x="360" y="182" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="18" font-weight="600" fill="#a371f7">LLM 微调与部署</text>

  <g transform="translate(836 68)">
    <rect width="104" height="104" rx="22" fill="#161b22" stroke="#30363d"/>
    <text x="52" y="66" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="38" font-weight="600" fill="#58a6ff">&lt;/&gt;</text>
  </g>
</svg>
